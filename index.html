<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Slab Yield Planner</title>
<style>
  :root{
    --bg: #1b1c1e;
    --panel: #232527;
    --panel-2: #2a2d30;
    --line: #3a3d40;
    --ink: #ece8e1;
    --ink-dim: #9a9691;
    --brass: #c08552;
    --brass-dim: #8a6440;
    --good: #7fae86;
    --warn: #d9995c;
    --slab: #d8d3c8;
    --slab-vein: #c3bcae;
    --cut: #e2503a;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    display:flex;
    min-height:100vh;
  }
  .mono{font-family: "SF Mono", "Menlo", "Consolas", monospace;}

  /* ---- left control column ---- */
  #controls{
    width: 340px;
    min-width:340px;
    background:var(--panel);
    border-right:1px solid var(--line);
    padding:22px 20px 40px;
    overflow-y:auto;
    height:100vh;
  }
  .eyebrow{
    font-size:11px;
    letter-spacing:.14em;
    text-transform:uppercase;
    color:var(--brass);
    font-weight:600;
    margin-bottom:4px;
  }
  h1{
    font-size:19px;
    margin:0 0 2px;
    font-weight:650;
    letter-spacing:-0.01em;
  }
  .sub{font-size:12.5px;color:var(--ink-dim);margin:0 0 22px;line-height:1.5;}

  .field-group{margin-bottom:18px;}
  .field-row{display:flex;gap:10px;margin-bottom:10px;}
  label{
    display:block;
    font-size:11px;
    color:var(--ink-dim);
    margin-bottom:5px;
    letter-spacing:.02em;
  }
  input[type=text], input[type=number]{
    width:100%;
    background:var(--panel-2);
    border:1px solid var(--line);
    color:var(--ink);
    padding:8px 9px;
    border-radius:6px;
    font-size:13px;
    font-family: "SF Mono", "Menlo", "Consolas", monospace;
  }
  input[type=text]{font-family:inherit;}
  input:focus{outline:none;border-color:var(--brass);}
  .flex1{flex:1;min-width:0;}

  h2.section{
    font-size:12px;
    text-transform:uppercase;
    letter-spacing:.1em;
    color:var(--ink-dim);
    border-top:1px solid var(--line);
    margin:22px 0 14px;
    padding-top:18px;
  }

  #pieces{margin-bottom:10px;}
  .piece-row{
    background:var(--panel-2);
    border:1px solid var(--line);
    border-radius:8px;
    padding:10px 10px 8px;
    margin-bottom:8px;
    position:relative;
  }
  .piece-row .field-row{margin-bottom:8px;}
  .piece-row .field-row:last-child{margin-bottom:0;}
  .remove-btn{
    position:absolute;
    top:6px;
    right:8px;
    background:none;
    border:none;
    color:var(--ink-dim);
    cursor:pointer;
    font-size:15px;
    line-height:1;
    padding:2px 4px;
  }
  .remove-btn:hover{color:var(--cut);}
  .qty-label{width:52px;flex:none;}

  button.add-piece{
    width:100%;
    background:transparent;
    border:1px dashed var(--line);
    color:var(--ink-dim);
    padding:9px;
    border-radius:7px;
    cursor:pointer;
    font-size:12.5px;
    margin-bottom:4px;
  }
  button.add-piece:hover{border-color:var(--brass);color:var(--brass);}

  .checkbox-row{
    display:flex;
    align-items:center;
    gap:8px;
    font-size:12.5px;
    color:var(--ink-dim);
    margin-top:14px;
  }
  .checkbox-row input{width:auto;}

  button.calc{
    width:100%;
    background:var(--brass);
    border:none;
    color:#1b1c1e;
    font-weight:700;
    padding:12px;
    border-radius:7px;
    cursor:pointer;
    font-size:13.5px;
    letter-spacing:.01em;
    margin-top:20px;
  }
  button.calc:hover{background:#cf9563;}

  /* ---- right results column ---- */
  #results{
    flex:1;
    padding:26px 34px 60px;
    overflow-y:auto;
    height:100vh;
  }
  #jobHeader{
    margin-bottom:16px;
  }
  #jobHeader .job-name{
    font-size:20px;
    font-weight:700;
    letter-spacing:-0.01em;
  }
  #jobHeader .job-date{
    font-size:12.5px;
    color:var(--ink-dim);
    font-family: "SF Mono", "Menlo", "Consolas", monospace;
    margin-top:2px;
  }
  #summary{
    display:flex;
    gap:14px;
    flex-wrap:wrap;
    margin-bottom:28px;
  }
  .stat{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:10px;
    padding:14px 20px;
    min-width:120px;
  }
  .stat .num{
    font-size:26px;
    font-weight:700;
    font-family: "SF Mono", "Menlo", "Consolas", monospace;
  }
  .stat .lbl{font-size:11px;color:var(--ink-dim);text-transform:uppercase;letter-spacing:.06em;margin-top:2px;}
  .stat.accent .num{color:var(--brass);}
  .stat.good .num{color:var(--good);}
  .stat.warn .num{color:var(--warn);}

  .slab-block{margin-bottom:38px;}
  .slab-title{
    font-size:13px;
    font-weight:650;
    margin-bottom:10px;
    display:flex;
    align-items:center;
    gap:10px;
  }
  .slab-title .yield-tag{
    font-family: "SF Mono", "Menlo", "Consolas", monospace;
    font-size:11.5px;
    color:var(--ink-dim);
    background:var(--panel-2);
    padding:2px 8px;
    border-radius:20px;
    border:1px solid var(--line);
  }
  svg.slab-svg{
    background:var(--slab);
    border-radius:4px;
    display:block;
  }
  .empty-note{
    color:var(--ink-dim);
    font-size:13px;
    margin-top:60px;
    text-align:center;
    line-height:1.7;
  }
  .empty-note .eyebrow{display:block;margin-bottom:8px;}
</style>
</head>
<body>

<div id="controls">
  <div class="eyebrow">Metro / Mele — Fabrication</div>
  <h1>Slab Yield Planner</h1>
  <p class="sub">Enter your slab size, list every piece off the takeoff, and get a cut layout with slab count and yield.</p>

  <div class="field-group">
    <h2 class="section" style="margin-top:0;padding-top:0;border-top:none;">Job</h2>
    <div class="field-row">
      <div class="flex1">
        <label>Job name</label>
        <input type="text" id="jobName" placeholder="e.g. Snow Residence">
      </div>
    </div>
    <div class="field-row">
      <div class="flex1">
        <label>Date</label>
        <input type="date" id="jobDate">
      </div>
    </div>
  </div>

  <div class="field-group">
    <h2 class="section">Slab</h2>
    <div class="field-row">
      <div class="flex1">
        <label>Length (in)</label>
        <input type="number" id="slabLen" value="126" step="0.25">
      </div>
      <div class="flex1">
        <label>Width (in)</label>
        <input type="number" id="slabWid" value="63" step="0.25">
      </div>
    </div>
    <div class="field-row">
      <div class="flex1">
        <label>Edge trim (in)</label>
        <input type="number" id="edgeTrim" value="1" step="0.125">
      </div>
      <div class="flex1">
        <label>Saw kerf gap (in)</label>
        <input type="number" id="kerf" value="0.25" step="0.0625">
      </div>
    </div>
    <div class="checkbox-row">
      <input type="checkbox" id="allowRotate" checked>
      <label style="margin:0;" for="allowRotate">Allow pieces to rotate 90°</label>
    </div>
  </div>

  <h2 class="section">Pieces</h2>
  <div id="pieces"></div>
  <button class="add-piece" onclick="addPiece()">+ Add piece</button>

  <button class="calc" onclick="runCalc()">Calculate slabs &amp; nesting</button>
</div>

<div id="results">
  <div id="jobHeader"></div>
  <div id="summary"></div>
  <div id="slabs"></div>
</div>

<script>
let pieceIdCounter = 0;

function addPiece(name, len, wid, qty){
  pieceIdCounter++;
  const id = 'p'+pieceIdCounter;
  const div = document.createElement('div');
  div.className = 'piece-row';
  div.id = id;
  div.innerHTML = `
    <button class="remove-btn" onclick="document.getElementById('${id}').remove()">×</button>
    <div class="field-row">
      <div class="flex1">
        <label>Name</label>
        <input type="text" class="p-name" value="${name || ''}" placeholder="e.g. Island counter">
      </div>
    </div>
    <div class="field-row">
      <div class="flex1">
        <label>Length (in)</label>
        <input type="number" class="p-len" value="${len ?? ''}" step="0.25">
      </div>
      <div class="flex1">
        <label>Width (in)</label>
        <input type="number" class="p-wid" value="${wid ?? ''}" step="0.25">
      </div>
      <div class="qty-label">
        <label>Qty</label>
        <input type="number" class="p-qty" value="${qty ?? 1}" min="1" step="1">
      </div>
    </div>
  `;
  document.getElementById('pieces').appendChild(div);
}

// default job date to today
(function(){
  const d = new Date();
  const iso = d.toISOString().slice(0,10);
  document.getElementById('jobDate').value = iso;
})();

// seed with a few typical rows
addPiece('Perimeter counter', 96, 25.5, 1);
addPiece('Island counter', 84, 42, 1);
addPiece('Backsplash', 96, 4, 1);

function readPieces(){
  const rows = document.querySelectorAll('.piece-row');
  const pieces = [];
  rows.forEach(row=>{
    const name = row.querySelector('.p-name').value.trim() || 'Piece';
    const len = parseFloat(row.querySelector('.p-len').value);
    const wid = parseFloat(row.querySelector('.p-wid').value);
    const qty = parseInt(row.querySelector('.p-qty').value) || 1;
    if(!isNaN(len) && !isNaN(wid) && len>0 && wid>0){
      for(let i=0;i<qty;i++){
        pieces.push({name, w: len, h: wid, qtyLabel: qty>1 ? ` (${i+1}/${qty})` : ''});
      }
    }
  });
  return pieces;
}

// Shelf-based best-fit-decreasing packer, multi-slab, optional rotation.
function packSlabs(pieces, slabW, slabH, gap, rotate){
  // sort largest-dimension first, then by area, for better packing
  const items = pieces.slice().sort((a,b)=>{
    const maxA = Math.max(a.w,a.h), maxB = Math.max(b.w,b.h);
    if(maxB !== maxA) return maxB-maxA;
    return (b.w*b.h)-(a.w*a.h);
  });

  const slabs = []; // each: {shelves:[{y,h,usedW}], placements:[{x,y,w,h,item}]}

  function newSlab(){
    return {shelves: [], placements: []};
  }

  function tryPlaceOnSlab(slab, item){
    const orientations = rotate ? [[item.w,item.h],[item.h,item.w]] : [[item.w,item.h]];
    // try existing shelves first
    for(const shelf of slab.shelves){
      for(const [w,h] of orientations){
        if(h <= shelf.h + 0.0001 && (shelf.usedW + gap + w) <= slabW + 0.0001){
          const x = shelf.usedW === 0 ? 0 : shelf.usedW + gap;
          const y = shelf.y;
          slab.placements.push({x,y,w,h,item});
          shelf.usedW = x + w;
          return true;
        }
      }
    }
    // start a new shelf
    const usedH = slab.shelves.reduce((sum,s)=> sum + s.h + gap, 0) - (slab.shelves.length? gap:0) + (slab.shelves.length? gap:0);
    const currentY = slab.shelves.length ? slab.shelves[slab.shelves.length-1].y + slab.shelves[slab.shelves.length-1].h + gap : 0;
    for(const [w,h] of orientations){
      if(currentY + h <= slabH + 0.0001 && w <= slabW + 0.0001){
        slab.shelves.push({y: currentY, h: h, usedW: w});
        slab.placements.push({x:0, y: currentY, w, h, item});
        return true;
      }
    }
    return false;
  }

  for(const item of items){
    let placed = false;
    for(const slab of slabs){
      if(tryPlaceOnSlab(slab, item)){ placed = true; break; }
    }
    if(!placed){
      const slab = newSlab();
      if(tryPlaceOnSlab(slab, item)){
        slabs.push(slab);
        placed = true;
      } else {
        // piece doesn't fit the slab at all, even alone
        slab.oversized = slab.oversized || [];
        slab.oversized.push(item);
        slabs.push(slab);
        placed = true;
      }
    }
  }
  return slabs;
}

function runCalc(){
  const slabLen = parseFloat(document.getElementById('slabLen').value);
  const slabWid = parseFloat(document.getElementById('slabWid').value);
  const edgeTrim = parseFloat(document.getElementById('edgeTrim').value) || 0;
  const kerf = parseFloat(document.getElementById('kerf').value) || 0;
  const rotate = document.getElementById('allowRotate').checked;

  const usableW = slabLen - edgeTrim*2;
  const usableH = slabWid - edgeTrim*2;

  const pieces = readPieces();
  const summaryEl = document.getElementById('summary');
  const slabsEl = document.getElementById('slabs');
  const jobHeaderEl = document.getElementById('jobHeader');
  summaryEl.innerHTML = '';
  slabsEl.innerHTML = '';

  const jobName = document.getElementById('jobName').value.trim();
  const jobDateRaw = document.getElementById('jobDate').value;
  let jobDateDisplay = '';
  if(jobDateRaw){
    const [y,m,dd] = jobDateRaw.split('-');
    jobDateDisplay = `${m}/${dd}/${y}`;
  }
  if(jobName || jobDateDisplay){
    jobHeaderEl.innerHTML = `
      ${jobName ? `<div class="job-name">${jobName}</div>` : ''}
      ${jobDateDisplay ? `<div class="job-date">${jobDateDisplay}</div>` : ''}
    `;
  } else {
    jobHeaderEl.innerHTML = '';
  }

  if(pieces.length === 0){
    slabsEl.innerHTML = `<div class="empty-note"><span class="eyebrow">Nothing to nest yet</span>Add at least one piece with a length and width.</div>`;
    return;
  }

  const slabs = packSlabs(pieces, usableW, usableH, kerf, rotate);

  const oversizedAll = [];
  slabs.forEach(s=>{ if(s.oversized) oversizedAll.push(...s.oversized); });
  const realSlabs = slabs.filter(s => s.placements.length > 0);

  const totalPieceSqFt = pieces.reduce((sum,p)=> sum + (p.w*p.h)/144, 0);
  const totalSlabSqFt = realSlabs.length * (slabLen*slabWid)/144;
  const yieldPct = totalSlabSqFt > 0 ? (totalPieceSqFt/totalSlabSqFt*100) : 0;

  // summary stats
  summaryEl.innerHTML = `
    <div class="stat accent"><div class="num">${realSlabs.length}</div><div class="lbl">Slabs needed</div></div>
    <div class="stat"><div class="num">${totalPieceSqFt.toFixed(1)}</div><div class="lbl">Sq ft of pieces</div></div>
    <div class="stat"><div class="num">${totalSlabSqFt.toFixed(1)}</div><div class="lbl">Sq ft of slab</div></div>
    <div class="stat ${yieldPct>=75?'good':'warn'}"><div class="num">${yieldPct.toFixed(0)}%</div><div class="lbl">Yield</div></div>
  `;

  if(oversizedAll.length){
    const warn = document.createElement('div');
    warn.style.cssText = 'background:#3a2a22;border:1px solid var(--warn);color:var(--warn);padding:12px 16px;border-radius:8px;margin-bottom:24px;font-size:13px;';
    warn.textContent = `${oversizedAll.length} piece(s) don't fit within a single slab's usable area (check for a piece longer than the slab, e.g. a waterfall leg or long run needing a seam): ${oversizedAll.map(o=>o.name).join(', ')}`;
    slabsEl.appendChild(warn);
  }

  const scale = 4.2; // px per inch, tuned for a comfortable on-screen width

  realSlabs.forEach((slab, idx)=>{
    const usedArea = slab.placements.reduce((sum,p)=> sum + p.w*p.h, 0);
    const slabArea = usableW*usableH;
    const slabYield = slabArea>0 ? (usedArea/slabArea*100) : 0;

    const block = document.createElement('div');
    block.className = 'slab-block';

    const svgW = slabLen*scale;
    const svgH = slabWid*scale;
    const offX = edgeTrim*scale;
    const offY = edgeTrim*scale;

    let rects = '';
    const palette = ['#c08552','#5b7c8d','#8a9a6f','#b06a5a','#7d6a9e','#a68a4a'];
    slab.placements.forEach((p, i)=>{
      const x = offX + p.x*scale;
      const y = offY + p.y*scale;
      const w = p.w*scale;
      const h = p.h*scale;
      const color = palette[i % palette.length];
      const label = p.item.name + p.item.qtyLabel;
      rects += `
        <g>
          <rect x="${x}" y="${y}" width="${w}" height="${h}" fill="${color}" fill-opacity="0.85" stroke="#1b1c1e" stroke-width="1"/>
          <text x="${x + w/2}" y="${y + h/2 - 6}" text-anchor="middle" font-size="11" font-family="-apple-system,Helvetica,Arial,sans-serif" fill="#1b1c1e" font-weight="600">${label}</text>
          <text x="${x + w/2}" y="${y + h/2 + 9}" text-anchor="middle" font-size="10.5" font-family="SF Mono, Menlo, Consolas, monospace" fill="#1b1c1e">${p.w}" × ${p.h}"</text>
        </g>
      `;
    });

    block.innerHTML = `
      <div class="slab-title">Slab ${idx+1} <span class="yield-tag">${slabYield.toFixed(0)}% used · ${slab.placements.length} piece${slab.placements.length!==1?'s':''}</span></div>
      <svg class="slab-svg" width="${svgW}" height="${svgH}" viewBox="0 0 ${svgW} ${svgH}">
        <rect x="0" y="0" width="${svgW}" height="${svgH}" fill="var(--slab)"/>
        <rect x="${offX}" y="${offY}" width="${usableW*scale}" height="${usableH*scale}" fill="none" stroke="var(--slab-vein)" stroke-width="1" stroke-dasharray="4 3"/>
        ${rects}
      </svg>
    `;
    slabsEl.appendChild(block);
  });
}

// run once on load with the seeded example
runCalc();
</script>

</body>
</html>
